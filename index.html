    .item-card {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 10px; border-radius: 6px; margin-bottom: 8px;
    }

    .item-price { font-size: 0.85rem; color: #666; }

      width: 28px; height: 28px; border: 1px solid #ccc;

    .char-list {

    .bonus-box {

    /* 画像出力ボタン */

    /* 画像化用のサマリーカード */
    #summary-card {
      display: none; width: 500px; background: #ffffff; padding: 20px;
      border-radius: 12px; border: 2px solid #6b5b95;

function createItemCard(item, isCharItem = false, charList = [], categoryKey = "", index = 0) {
  // 所属選択型（手ぬぐい等）
  if (item.hasAffiliation) {
    const listId = `affil-list-${categoryKey}-${index}`;
    const affilHtml = affiliations.map(a => `
      <div class="char-item">
        <span class="char-name-label">${a}</span>
        <div class="counter">
          <button onclick="updateQty(this, -1)">-</button>
          <input type="number" value="0" min="0" data-category="${categoryKey}" data-name="${item.name}" data-char="${a}" data-price="${item.price}" onchange="calculateTotal()">
          <button onclick="updateQty(this, 1)">+</button>
        </div>
      </div>
    `).join('');

    return `
      <div class="item-card">
        <div class="item-main">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">¥${item.price.toLocaleString()}</div>
          </div>
          <button class="char-toggle-btn" onclick="toggleCharList('${listId}')">所属別に選択 🏢</button>
        </div>
        <div class="char-list" id="${listId}">
          ${affilHtml}
        </div>
      </div>
    `;
  }

  // キャラ選択型
  if (isCharItem) {
    const listId = `char-list-${categoryKey}-${index}`;
    const charsHtml = charList.map(c => `
      <div class="char-item">
        <span class="char-name-label">${c}</span>
        <div class="counter">
          <button onclick="updateQty(this, -1)">-</button>
          <input type="number" value="0" min="0" data-category="${categoryKey}" data-name="${item.name}" data-char="${c}" data-price="${item.price}" onchange="calculateTotal()">
          <button onclick="updateQty(this, 1)">+</button>
        </div>
      </div>
    `).join('');

    return `
      <div class="item-card">
        <div class="item-main">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">¥${item.price.toLocaleString()}</div>
          </div>
          <button class="char-toggle-btn" onclick="toggleCharList('${listId}')">キャラ別に選択 👤</button>
        </div>
        <div class="char-list" id="${listId}">
          ${charsHtml}
        </div>
      </div>
    `;
  }

  // 通常商品
  return `
    <div class="item-card">
      <div class="item-main">
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">¥${item.price.toLocaleString()}</div>
        </div>
        <div class="counter">
          <button onclick="updateQty(this, -1)">-</button>
          <input type="number" value="0" min="0" data-category="${categoryKey}" data-name="${item.name}" data-price="${item.price}" onchange="calculateTotal()">
          <button onclick="updateQty(this, 1)">+</button>
        </div>
      </div>
    </div>
  `;
}

function toggleCharList(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function renderSection(elementId, items, isChar = false, charList = [], categoryKey = "") {
  const container = document.getElementById(elementId);
  container.innerHTML = items.map((item, idx) => createItemCard(item, isChar, charList, categoryKey, idx)).join('');
}

function renderAll() {
  renderSection("dm-venue-items", itemsData.dmVenue, false, [], "ドラマト（会場限定）");
  renderSection("dm-char-items", itemsData.dmChar, true, charsDoramato, "ドラマト（キャラ別）");
  renderSection("dm-open-items", itemsData.dmOpen, false, [], "ドラマト（その他）");
  renderSection("dm-trade-items", itemsData.dmTrade, false, [], "ドラマト（トレーディング）");

  renderSection("sm-venue-items", itemsData.smVenue, false, [], "スタマイ（会場限定）");
  renderSection("sm-char-items", itemsData.smChar, true, charsStamai, "スタマイ（キャラ別）");
  renderSection("sm-affil-items", itemsData.smAffil, false, [], "スタマイ（所属別）");
  renderSection("sm-open-items", itemsData.smOpen, false, [], "スタマイ（その他）");
  renderSection("sm-trade-items", itemsData.smTrade, false, [], "スタマイ（トレーディング）");
}

function updateQty(btn, change) {
  const input = btn.parentElement.querySelector('input');
  let currentVal = parseInt(input.value) || 0;
  currentVal = Math.max(0, currentVal + change);
  input.value = currentVal;
  calculateTotal();
}

function calculateTotal() {
  let total = 0;
  document.querySelectorAll('input[type="number"]').forEach(input => {
    const qty = parseInt(input.value) || 0;
    const price = parseInt(input.dataset.price) || 0;
    total += qty * price;
  });

  document.getElementById('total-price').innerText = `¥${total.toLocaleString()}`;

  const bonusUnit = 3000;
  const bonusCount = Math.floor(total / bonusUnit);
  const remainder = total % bonusUnit;
  const needed = bonusUnit - remainder;

  document.getElementById('bonus-count').innerText = bonusCount;
  
  if (total === 0) {
    document.getElementById('next-bonus').innerText = `（あと ¥3,000 で+1枚）`;
  } else if (remainder === 0) {
    document.getElementById('next-bonus').innerText = `（ちょうど達成！🎉）`;
  } else {
    document.getElementById('next-bonus').innerText = `（あと ¥${needed.toLocaleString()} で+1枚）`;
  }
}

function generateImage() {
  let groupedItems = {};
  let total = 0;

  document.querySelectorAll('input[type="number"]').forEach(input => {
    const qty = parseInt(input.value) || 0;
    if (qty > 0) {
      const category = input.dataset.category;
      const name = input.dataset.name;
      const charName = input.dataset.char;
      const price = parseInt(input.dataset.price) || 0;
      const subtotal = qty * price;
      total += subtotal;

      const fullItemName = charName ? `${name} [${charName}]` : name;

      if (!groupedItems[category]) groupedItems[category] = [];

      groupedItems[category].push({ name: fullItemName, qty, subtotal });
    }
  });

  if (Object.keys(groupedItems).length === 0) {
    alert('商品が1つも選択されていません。');
    return;
  }

  // サマリー生成
  const summaryContent = document.getElementById('summary-content');
  summaryContent.innerHTML = '';

  for (const [category, items] of Object.entries(groupedItems)) {
    let catHdr = document.createElement('div');
    catHdr.className = 'summary-sub-hdr';
    catHdr.innerText = category;
    summaryContent.appendChild(catHdr);

    let table = document.createElement('table');
    table.className = 'summary-table';
    
    let rowsHtml = items.map(item => `
      <tr>
        <td>${item.name}</td>
        <td class="qty" style="width: 40px;">${item.qty}</td>
        <td class="subtotal" style="width: 70px;">¥${item.subtotal.toLocaleString()}</td>
      </tr>
    `).join('');
    
    table.innerHTML = rowsHtml;
    summaryContent.appendChild(table);
  }

  document.getElementById('summary-total-price').innerText = `¥${total.toLocaleString()}`;
  document.getElementById('summary-bonus-count').innerText = Math.floor(total / 3000);

  // キャプチャ用に表示
  const summaryCard = document.getElementById('summary-card');
  summaryCard.style.display = 'block';

  html2canvas(summaryCard, { scale: 2 }).then(canvas => {
    summaryCard.style.display = 'none'; // 非表示に戻す

    // PNGダウンロード
    const link = document.createElement('a');
    link.download = 'アニバフェス購入リスト.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(err => {
    summaryCard.style.display = 'none';
    alert('画像の作成に失敗しました。');
  });
}

renderAll();
</script>
</body>
</html>
